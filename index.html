<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welding Manager Pro V19.5 - Master Full</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --azul: #0070f3; }
        .bg-azul { background-color: var(--azul); }
        .text-azul { color: var(--azul); }
        input:focus, textarea:focus, select:focus { outline: 2px solid var(--azul); border-color: transparent; }
        .loader { border-top-color: var(--azul); animation: spinner 0.6s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .autocomplete-dropdown { max-height: 200px; overflow-y: auto; z-index: 100; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .checkbox-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .btn-menu-gestion { transition: 0.3s; border-left: 8px solid var(--azul); }
        .btn-menu-gestion:active { scale: 0.95; }
        .status-pill { font-size: 10px; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; font-weight: 800; }
        .counter-pill { font-weight: 900; padding: 4px 10px; border-radius: 8px; font-size: 11px; display: inline-flex; align-items: center; gap: 4px; }
        .tabla-entregados { width: 100%; border-collapse: collapse; font-size: 11px; }
        .tabla-entregados th { background: #f3f4f6; padding: 8px; text-align: left; }
        .tabla-entregados td { padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body class="bg-gray-100 font-sans pb-10 text-gray-800">

    <div id="home-screen" class="p-6 max-w-md mx-auto h-screen flex flex-col justify-center relative">
        <span class="absolute top-4 left-4 text-[10px] font-black text-gray-400 uppercase tracking-widest">v19.5</span>
        <button onclick="showScreen('config-screen')" class="absolute top-6 right-6 text-gray-400 p-2 transition"><i class="fa-solid fa-gear text-3xl"></i></button>
        <div class="text-center mb-10">
            <i class="fa-solid fa-bolt-lightning text-azul text-6xl mb-2"></i>
            <h1 class="text-3xl font-bold uppercase tracking-tighter text-gray-900">Welding Manager</h1>
            <p class="text-gray-500 text-sm italic text-center">Servicio Técnico Soluciones Integrales</p>
        </div>
        <div class="grid gap-4">
            <button onclick="showScreen('ingreso-screen')" class="bg-azul text-white p-6 rounded-2xl shadow-xl flex items-center justify-between active:scale-95 transition text-left">
                <div><span class="block text-xl font-bold">Ingreso de Equipo</span><span class="text-sm opacity-80">Nueva OT y Guía</span></div>
                <i class="fa-solid fa-plus-circle text-3xl"></i>
            </button>
            <button onclick="cargarPendientes()" class="bg-white text-gray-700 p-6 rounded-2xl shadow flex items-center justify-between border-l-8 border-azul active:scale-95 transition text-left">
                <div><span class="block text-xl font-bold text-gray-900">Presupuesto</span><span class="text-sm opacity-50">Generar Cotización</span></div>
                <i class="fa-solid fa-file-invoice-dollar text-2xl text-azul"></i>
            </button>
            <button onclick="showScreen('menu-gestion-screen')" class="bg-white text-gray-700 p-6 rounded-2xl shadow flex items-center justify-between border-l-8 border-azul active:scale-95 transition text-left">
                <span class="text-xl font-bold text-gray-900">Gestión de Taller</span><i class="fa-solid fa-layer-group text-2xl text-azul"></i>
            </button>
        </div>
    </div>

    <div id="menu-gestion-screen" class="hidden p-6 max-w-md mx-auto bg-white min-h-screen text-gray-900">
        <div class="flex items-center mb-8 border-b pb-4">
            <button onclick="showScreen('home-screen')" class="text-gray-600 mr-4 p-2"><i class="fa-solid fa-arrow-left text-2xl"></i></button>

            <button onclick="abrirListaGestion('APROBADO')" class="btn-menu-gestion bg-gray-50 p-6 rounded-2xl shadow-sm flex items-center justify-between">

            <button onclick="abrirListaGestion('REPARADO')" class="btn-menu-gestion bg-gray-50 p-6 rounded-2xl shadow-sm flex items-center justify-between">
                <div class="text-left"><span class="block text-lg font-black uppercase">Reparados</span><span class="text-[10px] text-gray-400">Listos para Entrega</span></div>

            <button onclick="abrirListaGestion('ENTREGADO')" class="btn-menu-gestion bg-gray-50 p-6 rounded-2xl shadow-sm flex items-center justify-between border-l-gray-300">

    <div id="ingreso-screen" class="hidden p-4 max-w-md mx-auto bg-white min-h-screen text-gray-900">

        <div class="flex items-center mb-6 sticky top-0 bg-white py-2 border-b z-50">
            <button onclick="showScreen('presupuesto-list-screen')" class="text-gray-600 mr-4 p-2 transition"><i class="fa-solid fa-arrow-left text-2xl"></i></button>
            <h2 class="text-2xl font-bold">OT: <span id="ot-numero" class="text-azul font-black"></span></h2>

            <div class="relative">
                <label class="font-bold text-azul uppercase text-[10px] tracking-widest"><i class="fa-solid fa-stethoscope"></i> Diagnóstico Técnico</label>
                <textarea id="diagnostico" placeholder="Hallazgos..." class="w-full p-4 rounded-2xl border h-32 bg-gray-50 shadow-inner"></textarea>

            <button id="btn-enviar-presupuesto" onclick="enviarPresupuesto()" class="w-full bg-green-600 text-white py-5 rounded-2xl font-bold text-xl shadow-xl active:scale-95 transition uppercase tracking-widest">Guardar y Enviar</button>

    <div id="config-screen" class="hidden p-4 max-w-md mx-auto bg-white min-h-screen text-gray-900">
        <div class="flex items-center mb-6 border-b pb-4">
            <button onclick="showScreen('home-screen')" class="text-gray-600 mr-4 p-2"><i class="fa-solid fa-arrow-left text-2xl"></i></button>
            <h2 class="text-2xl font-bold">Configuración</h2>
        </div>
        <div class="space-y-8 pb-10">
            <div class="bg-orange-50 p-4 rounded-2xl border border-orange-200">
                <label class="font-bold text-orange-700 uppercase text-xs">Llave Groq IA</label>
                <div class="flex gap-2 mt-2">
                    <input type="password" id="ia-key-input" placeholder="gsk_..." class="flex-1 p-3 rounded-xl border bg-white">
                    <button onclick="guardarIAKey()" class="bg-orange-600 text-white px-4 rounded-xl shadow-md"><i class="fa-solid fa-save text-white"></i></button>
                </div>
            </div>
            <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200">
                <label class="font-bold text-azul uppercase text-xs">Importar Repuestos</label>
                <textarea id="import-repuestos" class="w-full p-3 rounded-xl border h-40 text-sm mt-2 text-gray-900" placeholder="Uno por línea..."></textarea>
                <button onclick="importarRepuestosMasivo()" class="w-full bg-azul text-white py-3 rounded-xl font-bold mt-2 shadow-md">Cargar Base</button>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz2t1slR2Ymxqnw_hre-y7bDQgZFtLsYYqj7du-9U0bBpDjMSl0g4hHCyILTwSFkBc1/exec";
        let dbFull = [];
        let repuestosDB = JSON.parse(localStorage.getItem('wm_repuestos')) || [];
        let otActiva = null; let repuestosActuales = [];

        window.onload = () => {
            const iaK = localStorage.getItem('wm_ia_key');
            if(iaK) document.getElementById('ia-key-input').value = iaK;
            sincronizarBaseAlInicio();
        };

        async function sincronizarBaseAlInicio() { try { const res = await fetch(WEB_APP_URL); dbFull = await res.json(); } catch(e) {} }
        function showScreen(id) { document.querySelectorAll('div[id$="-screen"]').forEach(s => s.style.display = 'none'); document.getElementById(id).style.display = (id === 'home-screen') ? 'flex' : 'block'; window.scrollTo(0,0); }
        function iniciarDictado(id) { const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)(); rec.lang = 'es-ES'; rec.start(); rec.onresult = (e) => { document.getElementById(id).value = e.results[0][0].transcript; }; }
        function guardarIAKey() { localStorage.setItem('wm_ia_key', document.getElementById('ia-key-input').value.trim()); alert("✅ Llave Guardada."); }

        // --- MOTOR DE TIEMPOS Y FLUJO V19.5 ---
        function calcularDias(fechaRef) {
            if (!fechaRef) return 0;
            const hoy = new Date();
            const ref = new Date(fechaRef);
            return Math.floor((hoy - ref) / (1000 * 60 * 60 * 24));
        }

        function inyectarEnGestion(equipo, estado) {
            let gestionLocal = JSON.parse(localStorage.getItem('wm_gestion_taller')) || [];
            gestionLocal = gestionLocal.filter(x => x.ot !== equipo.ot); // Evitar duplicados
            gestionLocal.push({
                ot: equipo.ot,
                NOMBRE: equipo.NOMBRE || equipo.nombre,
                MODELO: equipo.MODELO || equipo.modelo,
                MARCA: equipo.MARCA || equipo.marca,
                WHATSAPP: equipo.WHATSAPP || equipo.whatsapp,
                GUIA: equipo.GUIA || equipo.guia,
                ACCESORIOS: equipo.ACCESORIOS || equipo.accesorios,
                FALLA: equipo.FALLA || equipo.falla,
                plazo: equipo.PLAZO || equipo.plazo || 3,
                fechaEntrada: new Date().toISOString(),
                estado: estado
            });
            localStorage.setItem('wm_gestion_taller', JSON.stringify(gestionLocal));
        }

        function abrirListaGestion(filtro) {
            showScreen('lista-gestion-screen');
            document.getElementById('titulo-lista-gestion').innerText = filtro + "S";
            renderizarListaGestion(filtro);
        }

        function renderizarListaGestion(filtro) {
            const container = document.getElementById('contenedor-items-gestion');
            const gestionLocal = JSON.parse(localStorage.getItem('wm_gestion_taller')) || [];
            const filtrados = gestionLocal.filter(x => x.estado === filtro);

            if (filtro === 'ENTREGADO') {
                renderizarTablaEntregados(filtrados);
                return;
            }

            if (filtrados.length === 0) {
                container.innerHTML = '<p class="text-center py-20 text-gray-400 italic">Lista vacía.</p>';
                return;
            }

            container.innerHTML = filtrados.map(item => {
                const dias = calcularDias(item.fechaEntrada);
                let colorClass = "bg-blue-100 text-blue-600";
                
                if(filtro === 'PRESUPUESTADO') {
                    if(dias >= 4) colorClass = "bg-orange-100 text-orange-600";
                    if(dias > 7) colorClass = "bg-red-100 text-red-600";
                } else if(filtro === 'APROBADO') {
                    if(dias >= item.plazo - 1) colorClass = "bg-orange-100 text-orange-600";
                    if(dias >= item.plazo) colorClass = "bg-red-600 text-white animate-pulse";
                } else if(filtro === 'REPARADO' || filtro === 'RECHAZADO') {
                    colorClass = dias > 7 ? "bg-red-600 text-white" : "bg-green-100 text-green-600";
                }

                let botones = '';
                if(filtro === 'PRESUPUESTADO') {
                    botones = `<div class="grid grid-cols-2 gap-2 mt-4">
                        <button onclick="cambiarEstadoLocal('${item.ot}', 'APROBADO')" class="bg-green-600 text-white py-2 rounded-xl text-[10px] font-black uppercase">Aprobar</button>
                        <button onclick="cambiarEstadoLocal('${item.ot}', 'RECHAZADO')" class="bg-red-500 text-white py-2 rounded-xl text-[10px] font-black uppercase">Rechazar</button>
                    </div>`;
                } else if(filtro === 'APROBADO') {
                    botones = `<button onclick="cambiarEstadoLocal('${item.ot}', 'REPARADO')" class="w-full bg-azul text-white py-3 rounded-xl text-[10px] font-black uppercase mt-4">Equipo Listo</button>`;
                } else if(filtro === 'REPARADO' || filtro === 'RECHAZADO') {
                    botones = `<button onclick="cambiarEstadoLocal('${item.ot}', 'ENTREGADO')" class="w-full bg-gray-900 text-white py-3 rounded-xl text-[10px] font-black uppercase mt-4">Entregado</button>`;
                }

                return `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 text-gray-900">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="status-pill bg-gray-100 text-gray-500">OT-${item.ot}</span>
                            <h4 class="font-black text-lg text-gray-900">${item.NOMBRE}</h4>
                            <p class="text-xs text-gray-500 font-bold">${item.MARCA} ${item.MODELO}</p>
                        </div>
                        <a href="https://wa.me/${item.WHATSAPP}" class="bg-green-100 text-green-600 w-10 h-10 rounded-full flex items-center justify-center"><i class="fa-brands fa-whatsapp text-xl"></i></a>
                    </div>
                    <div class="mt-3 flex items-center justify-between">
                        <span class="counter-pill ${colorClass}"><i class="fa-regular fa-clock"></i> ${dias} DÍAS</span>
                    </div>
                    ${botones}
                </div>`;
            }).join('');
        }

        function renderizarTablaEntregados(datos) {
            const container = document.getElementById('contenedor-items-gestion');
            let html = `<div class="overflow-x-auto"><table class="tabla-entregados">
                <thead><tr><th>OT</th><th>CLIENTE</th><th>FECHA</th><th>DOC</th></tr></thead>
                <tbody>`;
            datos.forEach(x => {
                html += `<tr><td class="font-black">#${x.ot}</td><td>${x.NOMBRE}</td><td>${new Date(x.fechaEntrada).toLocaleDateString()}</td><td><i class="fa-solid fa-file-pdf text-red-500"></i></td></tr>`;
            });
            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        function cambiarEstadoLocal(ot, nuevoEstado) {
            const gestionLocal = JSON.parse(localStorage.getItem('wm_gestion_taller')) || [];
            const equipo = gestionLocal.find(x => x.ot === ot);
            if (equipo) {
                equipo.estado = nuevoEstado;
                equipo.fechaEntrada = new Date().toISOString();
                localStorage.setItem('wm_gestion_taller', JSON.stringify(gestionLocal));
                renderizarListaGestion(document.getElementById('titulo-lista-gestion').innerText.slice(0, -1));
                fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "update_status", ot: ot, estado: nuevoEstado }) });
            }
        }

        // --- MOTOR PDF GIGANTE V19.5 (RECUPERACIÓN TOTAL) ---

                doc.setFontSize(15); doc.setFont("helvetica", "bold"); doc.setTextColor(r,g,b); doc.text("II. DETALLES DEL EQUIPO", 10, cursorY); cursorY += 10;
                doc.setFontSize(13); doc.setFont("helvetica", "normal"); doc.setTextColor(40);

                doc.setFontSize(15); doc.setTextColor(r,g,b); doc.setFont("helvetica", "bold"); doc.text("III. FALLA REPORTADA", 10, cursorY); cursorY += 8;
                const fL = doc.splitTextToSize(ot.FALLA || ot.falla, 185); doc.setFillColor(248); doc.roundedRect(10, cursorY, 190, (fL.length*8)+8, 1, 1, 'F');
                doc.setFontSize(13); doc.setFont("helvetica", "normal"); doc.text(fL, 15, cursorY+8);
                cursorY = 230; doc.setFontSize(9); doc.setTextColor(100); doc.text("TÉRMINOS:", 10, cursorY);
                const nOT = ["1. Respuesta en 3 días hábiles.", "2. Rechazo genera cobro 0,05 UF.", "3. Día 8 sin respuesta aplica bodegaje (0,07 UF diario).", "4. 6 meses sin retiro pasa a dominio técnico."];
                nOT.forEach((n, i) => { doc.text(n, 10, cursorY + 6 + (i * 4.5)); });
                doc.line(30, 275, 80, 275); doc.text("Firma Cliente", 45, 280); doc.line(130, 275, 180, 275); doc.text("Firma Recepción", 145, 280);
            } else {

        async function enviarPresupuesto() {
            const d = document.getElementById('diagnostico').value; const v = document.getElementById('valor-neto').value;
            const p = document.getElementById('plazo').value; if(!d || !v) return alert("⚠️ Datos incompletos.");
            const btn = document.getElementById('btn-enviar-presupuesto'); btn.disabled = true;
            inyectarEnGestion({...otActiva, PLAZO: p}, 'PRESUPUESTADO');
            try { 
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "update_presupuesto", fila: otActiva.fila, DIAGNOSTICO: d, NETO: v, ESTADO: 'PRESUPUESTADO' }) }); 
                generarPDFGlobal('COT', otActiva, { diagnostico: d, valorNeto: v, plazo: p }); 
                const msg = `Estimado(a) *${otActiva.NOMBRE || otActiva.nombre}*, enviamos la *Cotización Técnica* para la *OT ${otActiva.ot}*. Saludos.`;
                window.open(`https://wa.me/${otActiva.WHATSAPP || otActiva.whatsapp}?text=${msg}`, '_blank');
                setTimeout(() => location.reload(), 1500); 
            } catch (e) { btn.disabled = false; }
        }

        document.getElementById('ingreso-form').addEventListener('submit', async (e) => {
            e.preventDefault(); const btn = document.getElementById('btn-submit'); btn.disabled = true;
            const accs = Array.from(document.querySelectorAll('.acc:checked')).map(el => el.value).join(', ');
            const totalAcc = accs + (document.getElementById('otros-acc').value ? ', ' + document.getElementById('otros-acc').value : '');
            const d = { NOMBRE: document.getElementById('nombre').value, RUT: document.getElementById('rut').value, WHATSAPP: document.getElementById('whatsapp').value, MARCA: document.getElementById('marca').value, MODELO: document.getElementById('modelo').value, SERIE: document.getElementById('serie').value, ACCESORIOS: totalAcc, FALLA: document.getElementById('falla').value, GUIA: document.getElementById('guia').value, ESTADO: 'INGRESADO' };
            try { 
                const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(d) });
                const r = await res.json();
                generarPDFGlobal('OT', { ...d, ot: r.ot }, {});
                alert("✅ OT #" + r.ot + " Registrada."); setTimeout(() => location.reload(), 1000); 
            } catch (e) { btn.disabled = false; }
        });

        function buscarCliente(t) {
            const ul = document.getElementById('sugerencias-cliente'); ul.innerHTML = '';
            if(t.length < 2) { ul.classList.add('hidden'); return; }
            const fil = dbFull.filter(c => (c.NOMBRE || c.nombre || "").toString().toLowerCase().includes(t.toLowerCase()));
            if(fil.length === 0) { ul.classList.add('hidden'); return; }
            ul.classList.remove('hidden');
            fil.forEach(c => {
                const li = document.createElement('li'); li.className = "p-4 border-b font-bold text-gray-900"; li.innerText = c.NOMBRE || c.nombre;
                li.onclick = () => {
                    document.getElementById('nombre').value = c.NOMBRE || c.nombre;
                    document.getElementById('rut').value = c.RUT || c.rut || '';
                    document.getElementById('whatsapp').value = c.WHATSAPP || c.whatsapp || '';
                    ul.classList.add('hidden');
                };
                ul.appendChild(li);
            });
        }

        async function cargarPendientes() {
            showScreen('presupuesto-list-screen'); document.getElementById('lista-pendientes').innerHTML = ''; document.getElementById('loading-pendientes').classList.remove('hidden');
            try {
                const res = await fetch(WEB_APP_URL); dbFull = await res.json();
                document.getElementById('loading-pendientes').classList.add('hidden');
                dbFull.filter(p => !(p.DIAGNOSTICO || p.diagnostico)).forEach(p => {
                    const div = document.createElement('div');
                    div.className = "bg-white p-5 rounded-2xl shadow-sm border-l-8 border-azul active:scale-95 transition cursor-pointer mb-4 text-gray-900";
                    div.onclick = () => { otActiva = p; document.getElementById('ot-numero').innerText = p.ot; document.getElementById('det-cliente').innerText = p.NOMBRE || p.nombre; document.getElementById('det-equipo').innerText = (p.MARCA || p.marca) + " " + (p.MODELO || p.modelo); document.getElementById('det-falla').innerText = p.FALLA || p.falla; repuestosActuales = []; renderRep(); showScreen('presupuesto-detail-screen'); };
                    div.innerHTML = `<div class="flex justify-between items-center"><div><span class="text-[10px] font-bold text-azul uppercase">OT-${p.ot}</span><h3 class="font-bold text-gray-900">${p.NOMBRE || p.nombre}</h3><p class="text-xs text-gray-500">${p.MARCA || p.marca} ${p.MODELO || p.modelo}</p></div><i class="fa-solid fa-chevron-right text-gray-200"></i></div>`;
                    document.getElementById('lista-pendientes').appendChild(div);
                });
            } catch (e) { alert("Error."); }
        }

        function buscarRepuesto(t) {
            const ul = document.getElementById('sugerencias-repuestos'); ul.innerHTML = '';
            if(t.length < 2) { ul.classList.add('hidden'); return; }
            const fil = repuestosDB.filter(r => r.toLowerCase().includes(t.toLowerCase()));
            if(fil.length === 0) { ul.classList.add('hidden'); return; }
            ul.classList.remove('hidden');
            fil.forEach(r => {
                const li = document.createElement('li'); li.className = "p-3 border-b text-xs font-bold text-gray-900"; li.innerText = r;
                li.onclick = () => { document.getElementById('buscador-repuesto').value = r; ul.classList.add('hidden'); };
                ul.appendChild(li);
            });
        }
        function agregarRepuestoLista() { const n = document.getElementById('buscador-repuesto').value; const c = document.getElementById('cantidad-repuesto').value; if(!n) return; repuestosActuales.push({ nombre: n, cantidad: parseInt(c) }); renderRep(); document.getElementById('buscador-repuesto').value = ''; }
        function renderRep() { document.getElementById('lista-repuestos-seleccionados').innerHTML = repuestosActuales.map((r, i) => `<li class="flex justify-between bg-white p-2 border rounded-xl text-xs font-bold text-gray-900"><span>${r.nombre} <b>x${r.cantidad}</b></span><button onclick="repuestosActuales.splice(${i},1);renderRep()" class="text-red-500"><i class="fa-solid fa-trash"></i></button></li>`).join(''); }
        function importarRepuestosMasivo() { const t = document.getElementById('import-repuestos').value; if(!t.trim()) return; const l = t.split('\n').map(x => x.trim()).filter(x => x !== ""); repuestosDB = [...new Set([...repuestosDB, ...l])]; localStorage.setItem('wm_repuestos', JSON.stringify(repuestosDB)); alert("✅ Repuestos cargados."); }
    </script>
