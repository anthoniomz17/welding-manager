<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welding Manager Pro V20.4 - Código Íntegro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --azul: #0070f3; }
        .bg-azul { background-color: var(--azul); }
        .text-azul { color: var(--azul); }
        input:focus, textarea:focus, select:focus { outline: 2px solid var(--azul); border-color: transparent; }
        .loader { border-top-color: var(--azul); animation: spinner 0.6s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .autocomplete-dropdown { max-height: 200px; overflow-y: auto; z-index: 100; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .checkbox-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .btn-menu-gestion { transition: 0.3s; border-left: 8px solid var(--azul); }
        .btn-menu-gestion:active { scale: 0.95; }
        .status-pill { font-size: 10px; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; font-weight: 800; }
        .counter-pill { font-weight: 900; padding: 4px 10px; border-radius: 8px; font-size: 11px; display: inline-flex; align-items: center; gap: 4px; }
        .tabla-entregados { width: 100%; border-collapse: collapse; font-size: 11px; }
        .tabla-entregados th { background: #f3f4f6; padding: 10px; text-align: left; text-transform: uppercase; }
        .tabla-entregados td { padding: 10px; border-bottom: 1px solid #eee; }
        
        /* SEMÁFORO DE SOMBRAS DINÁMICAS (DÍAS HÁBILES CHILE) */
        .sh-dia-1 { box-shadow: 0 15px 30px -5px rgba(34, 197, 94, 0.4); border: 1px solid rgba(34, 197, 94, 0.2); }
        .sh-dia-2 { box-shadow: 0 15px 30px -5px rgba(234, 179, 8, 0.4); border: 1px solid rgba(234, 179, 8, 0.2); }
        .sh-dia-3 { box-shadow: 0 15px 30px -5px rgba(239, 68, 68, 0.5); border: 1px solid rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body class="bg-gray-100 font-sans pb-10 text-gray-800">

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzS4m8_HUqXhAF_zLml_6LbmSnB5V73YVYNZ4MNJxd1ADAiALsCrJYXp4IVEG3jc0hM/exec";
        let dbFull = [];
        let clientesLocales = JSON.parse(localStorage.getItem('wm_clientes_locales')) || [];
        let repuestosDB = JSON.parse(localStorage.getItem('wm_repuestos')) || [];
        let otActiva = null; 
        let repuestosActuales = [];

        window.onload = () => {
            const iaK = localStorage.getItem('wm_ia_key');
            if(iaK) document.getElementById('ia-key-input').value = iaK;
            sincronizarBaseAlInicio();
        };

        // NORMALIZADOR DE DATOS: Asegura encontrar la columna sin importar si el Excel tiene mayúsculas o espacios.
        function gV(obj, k) {
            if (!obj) return "";
            const keys = Object.keys(obj);
            const f = keys.find(x => x.trim().toUpperCase() === k.toUpperCase());
            return f ? obj[f] : "";
        }

        async function sincronizarBaseAlInicio() { 
            try { 
                const res = await fetch(WEB_APP_URL + "?t=" + new Date().getTime()); 
                dbFull = await res.json(); 
            } catch(e) {} 
        }

        function showScreen(id) { 
            document.querySelectorAll('div[id$="-screen"]').forEach(s => s.style.display = 'none'); 
            document.getElementById(id).style.display = (id === 'home-screen') ? 'flex' : 'block'; 
            window.scrollTo(0,0); 
        }

        function iniciarDictado(id) { 
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)(); 
            rec.lang = 'es-ES'; rec.start(); 
            rec.onresult = (e) => { document.getElementById(id).value = e.results[0][0].transcript; }; 
        }

        function guardarIAKey() { localStorage.setItem('wm_ia_key', document.getElementById('ia-key-input').value.trim()); alert("✅ Llave IA Guardada."); }

        // --- LÓGICA DE DÍAS HÁBILES CHILE ---
        function calcularDiasHabiles(fechaInicio) {
            if (!fechaInicio) return 0;
            let start = new Date(fechaInicio);
            let end = new Date();
            let count = 0;
            let current = new Date(start);
            while (current <= end) {
                let day = current.getDay();
                if (day !== 0 && day !== 6) count++; 
                current.setDate(current.getDate() + 1);
            }
            return count;
        }

        // --- MOTOR DE GESTIÓN Y FLUJO NUBE V20.4 ---
        function inyectarEnGestion(equipo, estado) {
            let g = JSON.parse(localStorage.getItem('wm_gestion_taller')) || [];
            g = g.filter(x => x.ot.toString() !== equipo.ot.toString()); 
            
            const dataFull = {
                ...equipo,
                estado: estado,
                fechaEntrada: new Date().toISOString()
            };
            g.push(dataFull);
            localStorage.setItem('wm_gestion_taller', JSON.stringify(g));
        }

        function abrirListaGestion(f) {
            showScreen('lista-gestion-screen');
            document.getElementById('titulo-lista-gestion').innerText = f + "S";
            renderizarListaGestion(f);
        }

        function renderizarListaGestion(filtro) {
            const container = document.getElementById('contenedor-items-gestion');
            const g = JSON.parse(localStorage.getItem('wm_gestion_taller')) || [];
            const filtrados = g.filter(x => x.estado === filtro);

            if (filtro === 'ENTREGADO') { renderizarTablaEntregados(filtrados); return; }
            if (filtrados.length === 0) { container.innerHTML = '<p class="text-center py-20 text-gray-400 italic font-bold">No hay equipos en esta etapa.</p>'; return; }

            container.innerHTML = filtrados.map(item => {
                const dias = calcularDiasHabiles(item.fechaEntrada);
                let color = "bg-blue-100 text-blue-600";
                
                if(filtro === 'PRESUPUESTADO') {
                    if(dias === 2) color = "bg-orange-100 text-orange-600";
                    if(dias >= 3) color = "bg-red-100 text-red-600";
                } else if(filtro === 'APROBADO') {

        async function subirArchivoANube(ot, blob, fileName, mime) {
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = async () => {
                const base64 = reader.result.split(',')[1];
                const payload = { action: "upload_file", ot: ot, base64: base64, fileName: fileName, mimeType: mime };
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            };
        }

        function importarClientesMasivo() { 
            const t = document.getElementById('import-clientes').value; if(!t.trim()) return;
            const l = t.split('\n').map(x => { const p = x.split(',').map(s => s.trim()); return { NOMBRE: p[0], RUT: p[1] || '', WHATSAPP: p[2] || '', DIRECCION: p[3] || '', CORREO: p[4] || '' }; }).filter(x => x.NOMBRE);
            clientesLocales = l; localStorage.setItem('wm_clientes_locales', JSON.stringify(l)); alert("✅ Clientes listos.");
        }
    </script>
