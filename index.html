<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welding Manager Pro - Cloud Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --azul-electrico: #0070f3; }
        .bg-azul-electrico { background-color: var(--azul-electrico); }
        .text-azul-electrico { color: var(--azul-electrico); }
        .border-azul-electrico { border-color: var(--azul-electrico); }
        input:focus, textarea:focus, select:focus { outline: 2px solid var(--azul-electrico); border-color: transparent; }
        .loader { border-top-color: var(--azul-electrico); animation: spinner 0.6s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .autocomplete-dropdown { max-height: 250px; overflow-y: auto; z-index: 100; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2); }
        .card-pendientes:active { scale: 0.98; transition: 0.1s; }
    </style>
</head>
<body class="bg-gray-100 font-sans pb-10 text-gray-800">

    <div id="home-screen" class="p-6 max-w-md mx-auto h-screen flex flex-col justify-center relative">
        <button onclick="showScreen('config-screen')" class="absolute top-6 right-6 text-gray-400 hover:text-azul-electrico p-2 transition">
            <i class="fa-solid fa-gear text-3xl"></i>
        </button>

        <div class="text-center mb-10">
            <i class="fa-solid fa-bolt-lightning text-azul-electrico text-6xl mb-4"></i>
            <h1 class="text-3xl font-bold uppercase tracking-tight">Welding Manager</h1>
            <p class="text-gray-500 font-medium italic text-sm">Servicio Técnico Soluciones Integrales</p>
        </div>

        <div class="grid gap-4">
            <button onclick="showScreen('ingreso-screen')" class="bg-azul-electrico text-white p-6 rounded-2xl shadow-xl flex items-center justify-between active:scale-95 transition">
                <div class="text-left">
                    <span class="block text-xl font-bold">Ingreso de Equipo</span>
                    <span class="text-sm opacity-80 text-left">Nueva OT y PDF</span>
                </div>
                <i class="fa-solid fa-plus-circle text-3xl"></i>
            </button>
            
            <button onclick="cargarPendientes()" class="bg-white text-gray-700 p-6 rounded-2xl shadow flex items-center justify-between border-l-8 border-azul-electrico active:scale-95 transition">
                <div class="text-left">
                    <span class="block text-xl font-bold">Presupuesto</span>
                    <span class="text-sm opacity-50 text-left">Equipos por revisar</span>
                </div>
                <i class="fa-solid fa-file-invoice-dollar text-2xl text-azul-electrico"></i>
            </button>
            
            <button class="bg-white text-gray-700 p-6 rounded-2xl shadow flex items-center justify-between border-l-8 border-azul-electrico active:scale-95 transition">
                <span class="text-xl font-bold">Informes</span>
                <i class="fa-solid fa-chart-line text-2xl text-azul-electrico"></i>
            </button>
        </div>
    </div>

    <div id="config-screen" class="hidden p-4 max-w-md mx-auto bg-white min-h-screen shadow-2xl">
        <div class="flex items-center mb-6 sticky top-0 bg-white py-2 border-b z-50">
            <button onclick="showScreen('home-screen')" class="text-gray-600 mr-4 p-2 transition active:scale-90"><i class="fa-solid fa-arrow-left text-2xl"></i></button>
            <h2 class="text-2xl font-bold">Configuración</h2>
        </div>
        <div class="space-y-8">
            <div class="bg-purple-50 p-4 rounded-2xl border border-purple-200 shadow-sm">
                <label class="font-bold text-purple-700 uppercase text-xs flex items-center gap-2 mb-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Clave IA Gemini
                </label>
                <div class="flex gap-2">
                    <input type="password" id="api-key-input" placeholder="Pega tu clave AIza..." class="flex-1 p-3 rounded-xl border border-purple-200 bg-white">
                    <button onclick="guardarAPIKey()" class="bg-purple-600 text-white px-4 rounded-xl shadow-md"><i class="fa-solid fa-save"></i></button>
                </div>
                <p class="text-[10px] text-purple-400 mt-2 text-center">Usa la clave que termina en Nw1o</p>
            </div>
            
            <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200">
                <label class="font-bold text-azul-electrico uppercase text-xs flex items-center gap-2 mb-3">
                    <i class="fa-solid fa-boxes-stacked"></i> Repuestos Maestros
                </label>
                <textarea id="import-repuestos" class="w-full p-3 rounded-xl border h-40 text-sm" placeholder="Pega lista aquí (uno por línea)..."></textarea>
                <button onclick="importarRepuestosMasivo()" class="w-full bg-azul-electrico text-white py-3 rounded-xl font-bold mt-2 shadow-md">Cargar a la App</button>
            </div>
        </div>
    </div>

    <div id="ingreso-screen" class="hidden p-4 max-w-md mx-auto bg-white min-h-screen shadow-2xl">
        <div class="flex items-center mb-6 sticky top-0 bg-white py-2 border-b z-50">
            <button onclick="showScreen('home-screen')" class="text-gray-600 mr-4 p-2"><i class="fa-solid fa-arrow-left text-2xl"></i></button>
            <h2 class="text-2xl font-bold text-gray-800">Nuevo Ingreso</h2>
        </div>
        <form id="ingreso-form" class="space-y-6 pb-10">
            <div class="bg-blue-50 p-4 rounded-2xl space-y-3 relative shadow-sm border border-blue-100">
                <div class="relative">
                    <input type="text" id="nombre" onkeyup="buscarCliente(this.value)" autocomplete="off" placeholder="Nombre Cliente o Empresa" class="w-full p-3 rounded-xl border" required>
                    <ul id="sugerencias-cliente" class="autocomplete-dropdown absolute w-full bg-white border border-blue-200 rounded-lg hidden mt-1"></ul>
                </div>
                <input type="text" id="rut" placeholder="RUT" class="w-full p-3 rounded-xl border">
                <input type="tel" id="whatsapp" placeholder="WhatsApp" class="w-full p-3 rounded-xl border">
                <input type="text" id="direccion" placeholder="Dirección" class="w-full p-3 rounded-xl border">
                <input type="email" id="correo" placeholder="Email" class="w-full p-3 rounded-xl border">
            </div>
            
            <div class="bg-gray-50 p-4 rounded-2xl space-y-3 border border-gray-100 shadow-sm">
                <input type="text" id="marca" placeholder="Marca" class="w-full p-3 rounded-xl border" required>
                <input type="text" id="modelo" placeholder="Modelo" class="w-full p-3 rounded-xl border">
                <input type="text" id="serie" placeholder="N° Serie" class="w-full p-3 rounded-xl border">
            </div>
            
            <div class="space-y-3">
                <label class="font-bold text-gray-500 uppercase text-xs px-1 flex items-center gap-1">Acuse de Falla</label>
                <div class="relative">
                    <textarea id="falla" placeholder="Dicta lo que reporta el cliente..." class="w-full p-4 rounded-2xl border h-32 bg-gray-50 shadow-inner"></textarea>
                    <button type="button" onclick="iniciarDictado('falla')" class="absolute right-3 bottom-3 bg-azul-electrico text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center active:scale-90 transition"><i class="fa-solid fa-microphone text-xl"></i></button>
                </div>
            </div>
            
            <button type="submit" id="btn-submit" class="w-full bg-azul-electrico text-white py-5 rounded-2xl font-bold text-xl shadow-lg active:scale-95 transition">INGRESAR EQUIPO</button>
        </form>
    </div>

    <div id="presupuesto-list-screen" class="hidden p-4 max-w-md mx-auto bg-gray-50 min-h-screen">
        <div class="flex items-center mb-6 sticky top-0 bg-gray-50 py-2 border-b z-50">
            <button onclick="showScreen('home-screen')" class="text-gray-600 mr-4 p-2"><i class="fa-solid fa-arrow-left text-2xl"></i></button>
            <h2 class="text-2xl font-bold text-gray-800 tracking-tight">Equipos en Taller</h2>
        </div>
        <div id="loading-pendientes" class="flex flex-col items-center justify-center py-20 hidden">
            <div class="loader rounded-full border-4 h-12 w-12 mb-4 border-t-azul-electrico"></div>
            <p class="text-gray-500 font-medium">Consultando Planilla...</p>
        </div>
        <div id="lista-pendientes" class="space-y-4 pb-10"></div>
    </div>

    <div id="presupuesto-detail-screen" class="hidden p-4 max-w-md mx-auto bg-white min-h-screen shadow-2xl pb-10">
        <div class="flex items-center mb-6 sticky top-0 bg-white py-2 border-b z-50">
            <button onclick="showScreen('presupuesto-list-screen')" class="text-gray-600 mr-4 p-2 transition active:scale-90"><i class="fa-solid fa-arrow-left text-2xl"></i></button>
            <h2 class="text-2xl font-bold">OT: <span id="ot-numero" class="text-azul-electrico"></span></h2>
        </div>
        
        <div class="space-y-6">
            <div class="bg-gray-100 p-4 rounded-2xl border-l-8 border-azul-electrico shadow-sm">
                <p id="det-cliente" class="text-lg font-bold"></p>
                <p id="det-equipo" class="text-gray-600 text-sm font-semibold"></p>
                <p id="det-falla" class="mt-2 text-sm text-red-700 italic border-t pt-2"></p>
            </div>
            
            <div class="space-y-3 px-1">
                <label class="font-bold text-azul-electrico uppercase text-[10px] tracking-widest flex items-center gap-1"><i class="fa-solid fa-stethoscope"></i> Diagnóstico Técnico</label>
                <div class="relative">
                    <textarea id="diagnostico" placeholder="Dicta tus hallazgos técnicos..." class="w-full p-5 rounded-3xl border h-32 bg-gray-50 shadow-inner"></textarea>
                    <button type="button" onclick="iniciarDictado('diagnostico')" class="absolute right-3 bottom-3 bg-azul-electrico text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg active:scale-90 transition"><i class="fa-solid fa-microphone"></i></button>
                </div>
                <button type="button" id="btn-ia" onclick="mejorarDiagnosticoIA()" class="w-full bg-purple-600 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition shadow-lg">
                    <i class="fa-solid fa-wand-magic-sparkles text-xl"></i> OPTIMIZAR CON IA
                </button>
            </div>

            <div class="space-y-3 bg-gray-50 p-4 rounded-3xl border border-gray-200 shadow-sm">
                <label class="font-bold text-azul-electrico uppercase text-[10px] tracking-widest"><i class="fa-solid fa-boxes-stacked"></i> Repuestos / Servicios</label>
                <div class="flex gap-2 relative">
                    <div class="relative flex-1">
                        <input type="text" id="buscador-repuesto" onkeyup="buscarRepuesto(this.value)" autocomplete="off" placeholder="Buscar repuesto..." class="w-full p-3 rounded-xl border text-sm bg-white">
                        <ul id="sugerencias-repuestos" class="autocomplete-dropdown absolute w-full bg-white border border-gray-300 rounded-lg hidden mt-1 shadow-2xl"></ul>
                    </div>
                    <input type="number" id="cantidad-repuesto" value="1" min="1" class="w-16 p-3 rounded-xl border text-center font-bold text-gray-700 bg-white shadow-sm">
                    <button onclick="agregarRepuestoLista()" class="bg-azul-electrico text-white px-4 rounded-xl shadow-md active:scale-90 transition"><i class="fa-solid fa-plus text-lg"></i></button>
                </div>
                <ul id="lista-repuestos-seleccionados" class="space-y-2 mt-3"></ul>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="font-bold text-gray-500 uppercase text-[10px] px-1">Plazo</label>
                    <select id="plazo" class="w-full p-4 rounded-xl border bg-gray-50 font-bold text-sm text-gray-700 shadow-sm">
                        <option value="3 días hábiles">3 días</option><option value="5 días hábiles">5 días</option><option value="8 días hábiles">8 días</option><option value="15 días hábiles">15 días</option><option value="45 días">45 días</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="font-bold text-gray-500 uppercase text-[10px] px-1">Valor Neto</label>
                    <input type="number" id="valor-neto" placeholder="Neto CLP" class="w-full p-4 rounded-xl border border-gray-200 bg-gray-50 text-xl font-black">
                </div>
            </div>
            
            <button id="btn-enviar-presupuesto" onclick="enviarPresupuesto()" class="w-full bg-green-600 text-white py-5 rounded-2xl font-bold text-xl shadow-xl active:scale-95 transition flex items-center justify-center gap-2">
                <span>GENERAR COTIZACIÓN (PDF)</span>
                <i class="fa-solid fa-file-invoice"></i>
            </button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz2t1slR2Ymxqnw_hre-y7bDQgZFtLsYYqj7du-9U0bBpDjMSl0g4hHCyILTwSFkBc1/exec";
        let clientesDB = JSON.parse(localStorage.getItem('wm_clientes')) || [];
        let repuestosDB = JSON.parse(localStorage.getItem('wm_repuestos')) || [];
        let otActiva = null; let repuestosActuales = []; 

        window.onload = () => { const k = localStorage.getItem('wm_gemini_key'); if(k) document.getElementById('api-key-input').value = k; };
        function guardarAPIKey() { localStorage.setItem('wm_gemini_key', document.getElementById('api-key-input').value.trim()); alert("✅ IA Configurada."); }

        function buscarCliente(t) {
            const ul = document.getElementById('sugerencias-cliente'); ul.innerHTML = '';
            if(t.length < 2) { ul.classList.add('hidden'); return; }
            const fil = clientesDB.filter(c => c.nombre.toLowerCase().includes(t.toLowerCase()));
            if(fil.length === 0) { ul.classList.add('hidden'); return; }
            ul.classList.remove('hidden');
            fil.forEach(c => {
                const li = document.createElement('li'); li.className = "p-4 border-b hover:bg-blue-50 cursor-pointer text-sm font-semibold"; li.innerText = c.nombre;
                li.onclick = () => { document.getElementById('nombre').value = c.nombre; document.getElementById('rut').value = c.rut || ''; document.getElementById('direccion').value = c.direccion || ''; document.getElementById('whatsapp').value = c.whatsapp || ''; document.getElementById('correo').value = c.correo || ''; ul.classList.add('hidden'); };
                ul.appendChild(li);
            });
        }

        function buscarRepuesto(t) {
            const ul = document.getElementById('sugerencias-repuestos'); ul.innerHTML = '';
            if(t.length < 2) { ul.classList.add('hidden'); return; }
            const fil = repuestosDB.filter(r => r.toLowerCase().includes(t.toLowerCase()));
            if(fil.length === 0) { ul.classList.add('hidden'); return; }
            ul.classList.remove('hidden');
            fil.forEach(r => {
                const li = document.createElement('li'); li.className = "p-4 border-b hover:bg-gray-100 cursor-pointer text-sm font-semibold text-gray-700"; li.innerText = r;
                li.onclick = () => { document.getElementById('buscador-repuesto').value = r; ul.classList.add('hidden'); };
                ul.appendChild(li);
            });
        }

        function importarRepuestosMasivo() { const t = document.getElementById('import-repuestos').value; if(!t.trim()) return; const l = t.split('\n').map(x => x.trim()).filter(x => x !== ""); repuestosDB = [...new Set([...repuestosDB, ...l])]; localStorage.setItem('wm_repuestos', JSON.stringify(repuestosDB)); alert("✅ Repuestos cargados."); document.getElementById('import-repuestos').value = ""; }
        
        function agregarRepuestoLista(n=null, c=1) {
            const name = n || document.getElementById('buscador-repuesto').value; const cant = n ? c : document.getElementById('cantidad-repuesto').value;
            if(!name) return; repuestosActuales.push({ nombre: name, cantidad: parseInt(cant) }); renderRep();
            document.getElementById('buscador-repuesto').value = ''; document.getElementById('cantidad-repuesto').value = '1';
        }

        function renderRep() { document.getElementById('lista-repuestos-seleccionados').innerHTML = repuestosActuales.map((r, i) => `<li class="flex justify-between bg-white p-3 border border-gray-100 rounded-xl text-sm mb-2 shadow-sm font-medium"><span>${r.nombre} <span class="text-azul-electrico font-bold ml-1">x${r.cantidad}</span></span><button onclick="repuestosActuales.splice(${i},1);renderRep()" class="text-red-400 px-2"><i class="fa-solid fa-trash"></i></button></li>`).join(''); }

        function showScreen(id) { document.querySelectorAll('div[id$="-screen"]').forEach(s => s.style.display = 'none'); document.getElementById(id).style.display = (id === 'home-screen') ? 'flex' : 'block'; window.scrollTo(0,0); }

        function iniciarDictado(id) { const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)(); rec.lang = 'es-ES'; rec.start(); rec.onresult = (e) => { document.getElementById(id).value = e.results[0][0].transcript; }; }

        async function mejorarDiagnosticoIA() {
            const key = localStorage.getItem('wm_gemini_key');
            const diagInput = document.getElementById('diagnostico').value;
            if(!key) return alert("⚠️ Ingresa tu API Key en la Tuerca.");
            if(diagInput.length < 5) return alert("⚠️ Dicta o escribe algo primero.");

            const btn = document.getElementById('btn-ia'); btn.disabled = true; 
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ANALIZANDO...';

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
            const prompt = `Eres ingeniero jefe de Servicio Técnico Soluciones Integrales. Profesionaliza este diagnóstico: "${diagInput}". Responde ÚNICAMENTE JSON: {"diagnostico_profesional": "texto formal aquí", "repuestos_sugeridos": ["rep1"]}`;

            try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
                const data = await response.json();
                if(data.error) throw new Error(data.error.message);
                let raw = data.candidates[0].content.parts[0].text.replace(/```json/g, "").replace(/```/g, "").trim();
                const json = JSON.parse(raw);
                document.getElementById('diagnostico').value = json.diagnostico_profesional;
                if(json.repuestos_sugeridos) json.repuestos_sugeridos.forEach(r => agregarRepuestoLista(r, 1));
                btn.innerHTML = '✨ ¡INFORME LISTO!';
            } catch (e) { alert("Error IA: " + e.message); btn.innerHTML = 'REINTENTAR'; }
            setTimeout(() => { btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> OPTIMIZAR CON IA'; btn.disabled = false; }, 2500);
        }

        async function cargarPendientes() {
            showScreen('presupuesto-list-screen'); document.getElementById('lista-pendientes').innerHTML = ''; document.getElementById('loading-pendientes').style.display = 'flex';
            try {
                const res = await fetch(WEB_APP_URL); const data = await res.json(); document.getElementById('loading-pendientes').style.display = 'none';
                if(data.length === 0) { document.getElementById('lista-pendientes').innerHTML = '<p class="text-center py-20 text-gray-400 font-bold">Todo al día.</p>'; return; }
                data.forEach(p => {
                    const div = document.createElement('div'); div.className = "bg-white p-5 rounded-2xl shadow-md border-l-8 border-azul-electrico active:scale-95 transition cursor-pointer card-pendientes";
                    div.onclick = () => { otActiva = p; document.getElementById('ot-numero').innerText = p.ot; document.getElementById('det-cliente').innerText = p.nombre; document.getElementById('det-equipo').innerText = p.marca + " " + p.modelo; document.getElementById('det-falla').innerText = '"' + p.falla + '"'; repuestosActuales = []; renderRep(); showScreen('presupuesto-detail-screen'); };
                    div.innerHTML = `<div class="flex justify-between items-center"><div><span class="text-[10px] font-bold text-azul-electrico uppercase">OT-${p.ot}</span><h3 class="font-bold text-gray-800">${p.nombre}</h3><p class="text-xs text-gray-500 font-medium">${p.marca} ${p.modelo}</p></div><i class="fa-solid fa-chevron-right text-gray-200"></i></div>`;
                    document.getElementById('lista-pendientes').appendChild(div);
                });
            } catch (e) { alert("Error Excel."); }
        }

        async function enviarPresupuesto() {
            const diag = document.getElementById('diagnostico').value; const val = document.getElementById('valor-neto').value;
            if(!diag || !val) return alert("⚠️ Faltan datos.");
            const btn = document.getElementById('btn-enviar-presupuesto'); btn.disabled = true; btn.innerHTML = 'GUARDANDO...';
            const payload = { action: "update_presupuesto", fila: otActiva.fila, diagnostico: diag, valor: val };
            try { await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }); await generarPDFCotizacion(otActiva, diag, repuestosActuales, document.getElementById('plazo').value, val); alert("✅ Guardado y PDF generado."); location.reload(); } catch (e) { alert("Error."); btn.disabled = false; }
        }

        async function generarPDFCotizacion(ot, diagnostico, arrRepuestos, plazo, valorNeto) {
            const { jsPDF } = window.jspdf; const doc = new jsPDF(); const r = 0, g = 112, b = 243; 
            doc.setFillColor(r, g, b); doc.rect(0, 0, 210, 52, 'F');
            doc.setTextColor(255, 255, 255); doc.setFontSize(16); doc.text("SERVICIO TÉCNICO SOLUCIONES INTEGRALES", 15, 15); doc.setFontSize(22); doc.text("COTIZACIÓN TÉCNICA", 15, 28); doc.setFontSize(9); doc.text("RUT: 76349984-7 | amsetecsi@gmail.com", 15, 38);
            doc.setTextColor(40, 40, 40); doc.text(`OT N°: ${ot.ot}`, 160, 62); doc.text(`Fecha: ${new Date().toLocaleDateString()}`, 160, 68);
            let cursorY = 75; doc.setFontSize(12); doc.setTextColor(r,g,b); doc.setFont("helvetica", "bold"); doc.text("DIAGNÓSTICO TÉCNICO", 15, cursorY); cursorY += 8;
            doc.setTextColor(40,40,40); doc.setFont("helvetica", "normal"); doc.setFontSize(10);
            const diagLines = doc.splitTextToSize(diagnostico, 175); doc.setFillColor(250); doc.setDrawColor(230); doc.roundedRect(15, cursorY, 180, (diagLines.length * 6) + 4, 2, 2, 'FD'); doc.text(diagLines, 20, cursorY + 6); cursorY += (diagLines.length * 6) + 15;
            doc.setTextColor(r,g,b); doc.setFont("helvetica", "bold"); doc.text("REPUESTOS Y SERVICIOS", 15, cursorY); cursorY += 8;
            doc.setTextColor(40,40,40); const repT = arrRepuestos.map(r => `• ${r.nombre} (x${r.cantidad})`).join('\n') || "Servicios incluidos."; const repLines = doc.splitTextToSize(repT, 175); doc.roundedRect(15, cursorY, 180, (repLines.length * 6) + 4, 2, 2, 'FD'); doc.text(repLines, 20, cursorY + 6); cursorY += (repLines.length * 6) + 15;
            const total = Math.round(parseInt(valorNeto) * 1.19); doc.setFontSize(14); doc.setFont("helvetica", "bold"); doc.text(`TOTAL A PAGAR (IVA INC): $${new Intl.NumberFormat("es-CL").format(total)} CLP`, 15, cursorY);
            doc.save(`Cotizacion_OT${ot.ot}.pdf`);
        }

        document.getElementById('ingreso-form').addEventListener('submit', async (e) => {
            e.preventDefault(); const btn = document.getElementById('btn-submit'); btn.disabled = true; btn.innerHTML = 'REGISTRANDO...';
            const d = { nombre: document.getElementById('nombre').value, rut: document.getElementById('rut').value, whatsapp: document.getElementById('whatsapp').value, direccion: document.getElementById('direccion').value, correo: document.getElementById('correo').value, marca: document.getElementById('marca').value, modelo: document.getElementById('modelo').value, serie: document.getElementById('serie').value, falla: document.getElementById('falla').value };
            try { await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(d) }); alert("✅ OT Registrada en Excel."); location.reload(); } catch (e) { alert("Error."); btn.disabled = false; }
        });
