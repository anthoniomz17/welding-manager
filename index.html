<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welding Manager Pro V14 - Formato Original</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --azul: #0070f3; }
        .bg-azul { background-color: var(--azul); }
        .text-azul { color: var(--azul); }
        input:focus, textarea:focus { outline: 2px solid var(--azul); border-color: transparent; }
        .loader { border-top-color: var(--azul); animation: spinner 0.6s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .autocomplete-dropdown { max-height: 250px; overflow-y: auto; z-index: 100; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2); }
    </style>
</head>
<body class="bg-gray-100 font-sans pb-10 text-gray-800">

    <div id="home-screen" class="p-6 max-w-md mx-auto h-screen flex flex-col justify-center relative">
        <button onclick="showScreen('config-screen')" class="absolute top-6 right-6 text-gray-400 p-2"><i class="fa-solid fa-gear text-3xl"></i></button>
        <div class="text-center mb-10">
            <i class="fa-solid fa-bolt-lightning text-azul text-6xl mb-4"></i>
            <h1 class="text-3xl font-bold uppercase tracking-tight text-gray-900">Welding Manager</h1>
            <p class="text-gray-500 font-medium italic text-sm">Servicio Técnico Soluciones Integrales</p>
        </div>
        <div class="grid gap-4">
            <button onclick="showScreen('ingreso-screen')" class="bg-azul text-white p-6 rounded-2xl shadow-xl flex items-center justify-between active:scale-95 transition">
                <div class="text-left"><span class="block text-xl font-bold">Ingreso de Equipo</span><span class="text-sm opacity-80">Nueva OT</span></div>
                <i class="fa-solid fa-plus-circle text-3xl"></i>
            </button>
            <button onclick="cargarPendientes()" class="bg-white text-gray-700 p-6 rounded-2xl shadow flex items-center justify-between border-l-8 border-azul active:scale-95 transition">
                <div class="text-left"><span class="block text-xl font-bold">Presupuesto</span><span class="text-sm opacity-50">Equipos por revisar</span></div>
                <i class="fa-solid fa-file-invoice-dollar text-2xl text-azul"></i>
            </button>
            <button onclick="alert('Módulo de Informes en Desarrollo')" class="bg-white text-gray-700 p-6 rounded-2xl shadow flex items-center justify-between border-l-8 border-azul active:scale-95 transition">
                <span class="text-xl font-bold">Informes</span><i class="fa-solid fa-chart-line text-2xl text-azul"></i>
            </button>
        </div>
    </div>

    <div id="ingreso-screen" class="hidden p-4 max-w-md mx-auto bg-white min-h-screen">
        <div class="flex items-center mb-6 sticky top-0 bg-white py-2 border-b z-50">
            <button onclick="showScreen('home-screen')" class="text-gray-600 mr-4 p-2"><i class="fa-solid fa-arrow-left text-2xl"></i></button>
            <h2 class="text-2xl font-bold">Registro OT</h2>
        </div>
        <form id="ingreso-form" class="space-y-4 pb-10">
            <div class="bg-blue-50 p-4 rounded-2xl space-y-3 relative shadow-sm border border-blue-100">
                <input type="text" id="nombre" onkeyup="buscarCliente(this.value)" placeholder="Cliente / Empresa" class="w-full p-3 rounded-xl border" required autocomplete="off">
                <ul id="sugerencias-cliente" class="autocomplete-dropdown absolute w-full bg-white border border-blue-200 rounded-lg hidden mt-1"></ul>
                <input type="text" id="rut" placeholder="RUT" class="w-full p-3 rounded-xl border">
                <input type="tel" id="whatsapp" placeholder="WhatsApp" class="w-full p-3 rounded-xl border">
                <input type="text" id="direccion" placeholder="Dirección" class="w-full p-3 rounded-xl border">
                <input type="email" id="correo" placeholder="Email" class="w-full p-3 rounded-xl border">
            </div>
            <div class="bg-gray-50 p-4 rounded-2xl space-y-3 border border-gray-100">
                <input type="text" id="marca" placeholder="Marca" class="w-full p-3 rounded-xl border" required>
                <input type="text" id="modelo" placeholder="Modelo" class="w-full p-3 rounded-xl border">
                <input type="text" id="serie" placeholder="N° de Serie" class="w-full p-3 rounded-xl border">
            </div>
            <div class="relative">
                <textarea id="falla" placeholder="Falla reportada..." class="w-full p-4 rounded-2xl border h-28 bg-gray-50"></textarea>
                <button type="button" onclick="iniciarDictado('falla')" class="absolute right-3 bottom-3 bg-azul text-white w-10 h-10 rounded-full shadow-lg flex items-center justify-center"><i class="fa-solid fa-microphone"></i></button>
            </div>
            <button type="submit" id="btn-submit" class="w-full bg-azul text-white py-5 rounded-2xl font-bold text-xl shadow-lg">REGISTRAR INGRESO</button>
        </form>
    </div>

    <div id="presupuesto-list-screen" class="hidden p-4 max-w-md mx-auto bg-gray-50 min-h-screen">
        <div class="flex items-center mb-6 sticky top-0 bg-gray-50 py-2 border-b z-50">
            <button onclick="showScreen('home-screen')" class="text-gray-600 mr-4 p-2"><i class="fa-solid fa-arrow-left text-2xl"></i></button>
            <h2 class="text-2xl font-bold">Pendientes</h2>
        </div>
        <div id="loading-pendientes" class="flex flex-col items-center justify-center py-20 hidden">
            <div class="loader rounded-full border-4 h-12 w-12 mb-4 border-t-azul"></div>
        </div>
        <div id="lista-pendientes" class="space-y-4 pb-10"></div>
    </div>

    <div id="presupuesto-detail-screen" class="hidden p-4 max-w-md mx-auto bg-white min-h-screen pb-10">
        <div class="flex items-center mb-6 sticky top-0 bg-white py-2 border-b z-50">
            <button onclick="showScreen('presupuesto-list-screen')" class="text-gray-600 mr-4 p-2"><i class="fa-solid fa-arrow-left text-2xl"></i></button>
            <h2 class="text-2xl font-bold">OT: <span id="ot-numero" class="text-azul font-black"></span></h2>
        </div>
        <div class="space-y-5">
            <div class="bg-gray-100 p-4 rounded-2xl border-l-8 border-azul">
                <p id="det-cliente" class="text-lg font-bold"></p>
                <p id="det-equipo" class="text-gray-600 text-sm"></p>
                <p id="det-falla" class="mt-2 text-sm text-red-700 italic border-t pt-2"></p>
            </div>
            
            <div class="relative">
                <label class="font-bold text-azul uppercase text-[10px] tracking-widest">Diagnóstico Técnico</label>
                <textarea id="diagnostico" placeholder="Describe los hallazgos..." class="w-full p-4 rounded-2xl border h-32 bg-gray-50 mt-1"></textarea>
                <button type="button" onclick="iniciarDictado('diagnostico')" class="absolute right-3 bottom-3 bg-azul text-white w-10 h-10 rounded-full flex items-center justify-center"><i class="fa-solid fa-microphone"></i></button>
            </div>

            <div class="bg-gray-50 p-4 rounded-2xl border">
                <label class="font-bold text-azul uppercase text-[10px] tracking-widest">Repuestos / Servicios</label>
                <div class="flex gap-2 mt-1">
                    <input type="text" id="buscador-repuesto" onkeyup="buscarRepuesto(this.value)" placeholder="Buscar..." class="flex-1 p-3 rounded-xl border text-sm">
                    <input type="number" id="cantidad-repuesto" value="1" min="1" class="w-16 p-3 rounded-xl border text-center font-bold">
                    <button onclick="agregarRepuestoLista()" class="bg-azul text-white px-4 rounded-xl"><i class="fa-solid fa-plus"></i></button>
                </div>
                <ul id="sugerencias-repuestos" class="autocomplete-dropdown absolute w-64 bg-white border hidden mt-1 shadow-2xl z-50"></ul>
                <ul id="lista-repuestos-seleccionados" class="space-y-2 mt-3"></ul>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] font-bold text-gray-400">Plazo Entrega</label>
                    <select id="plazo" class="w-full p-3 rounded-xl border font-bold">
                        <option value="3 días hábiles">3 días</option>
                        <option value="5 días hábiles">5 días</option>
                        <option value="15 días hábiles">15 días</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-400">Valor Neto</label>
                    <input type="number" id="valor-neto" placeholder="Neto CLP" class="w-full p-3 rounded-xl border text-lg font-black">
                </div>
            </div>
            
            <button id="btn-enviar-presupuesto" onclick="enviarPresupuesto()" class="w-full bg-green-600 text-white py-5 rounded-2xl font-bold text-xl shadow-xl">GENERAR COTIZACIÓN</button>
        </div>
    </div>

    <div id="config-screen" class="hidden p-4 max-w-md mx-auto bg-white min-h-screen">
        <div class="flex items-center mb-6">
            <button onclick="showScreen('home-screen')" class="text-gray-600 mr-4 p-2"><i class="fa-solid fa-arrow-left text-2xl"></i></button>
            <h2 class="text-2xl font-bold">Configuración</h2>
        </div>
        <div class="bg-gray-50 p-4 rounded-2xl border">
            <label class="font-bold text-azul uppercase text-xs">Cargar Lista de Repuestos</label>
            <textarea id="import-repuestos" class="w-full p-3 rounded-xl border h-40 text-sm mt-2" placeholder="Copia y pega tu lista aquí..."></textarea>
            <button onclick="importarRepuestosMasivo()" class="w-full bg-azul text-white py-3 rounded-xl font-bold mt-2 shadow-md">Importar Datos</button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz2t1slR2Ymxqnw_hre-y7bDQgZFtLsYYqj7du-9U0bBpDjMSl0g4hHCyILTwSFkBc1/exec";
        let clientesDB = JSON.parse(localStorage.getItem('wm_clientes')) || [];
        let repuestosDB = JSON.parse(localStorage.getItem('wm_repuestos')) || [];
        let otActiva = null; let repuestosActuales = []; 

        // Lógica de pantallas e interfaz
        function showScreen(id) { document.querySelectorAll('div[id$="-screen"]').forEach(s => s.style.display = 'none'); document.getElementById(id).style.display = (id === 'home-screen') ? 'flex' : 'block'; window.scrollTo(0,0); }
        function iniciarDictado(id) { const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)(); rec.lang = 'es-ES'; rec.start(); rec.onresult = (e) => { document.getElementById(id).value = e.results[0][0].transcript; }; }

        // Gestión de Autocompletado
        function buscarCliente(t) {
            const ul = document.getElementById('sugerencias-cliente'); ul.innerHTML = '';
            if(t.length < 2) { ul.classList.add('hidden'); return; }
            const fil = clientesDB.filter(c => c.nombre.toLowerCase().includes(t.toLowerCase()));
            if(fil.length === 0) { ul.classList.add('hidden'); return; }
            ul.classList.remove('hidden');
            fil.forEach(c => {
                const li = document.createElement('li'); li.className = "p-4 border-b hover:bg-blue-50 cursor-pointer font-semibold text-sm"; li.innerText = c.nombre;
                li.onclick = () => { document.getElementById('nombre').value = c.nombre; document.getElementById('rut').value = c.rut || ''; document.getElementById('direccion').value = c.direccion || ''; ul.classList.add('hidden'); };
                ul.appendChild(li);
            });
        }

        function buscarRepuesto(t) {
            const ul = document.getElementById('sugerencias-repuestos'); ul.innerHTML = '';
            if(t.length < 2) { ul.classList.add('hidden'); return; }
            const fil = repuestosDB.filter(r => r.toLowerCase().includes(t.toLowerCase()));
            if(fil.length === 0) { ul.classList.add('hidden'); return; }
            ul.classList.remove('hidden');
            fil.forEach(r => {
                const li = document.createElement('li'); li.className = "p-3 border-b hover:bg-gray-100 cursor-pointer text-xs"; li.innerText = r;
                li.onclick = () => { document.getElementById('buscador-repuesto').value = r; ul.classList.add('hidden'); };
                ul.appendChild(li);
            });
        }

        function importarRepuestosMasivo() { 
            const t = document.getElementById('import-repuestos').value; if(!t.trim()) return; 
            const l = t.split('\n').map(x => x.trim()).filter(x => x !== ""); 
            repuestosDB = [...new Set([...repuestosDB, ...l])]; 
            localStorage.setItem('wm_repuestos', JSON.stringify(repuestosDB)); 
            alert("✅ Repuestos cargados."); 
        }

        function agregarRepuestoLista() {
            const name = document.getElementById('buscador-repuesto').value; 
            const cant = document.getElementById('cantidad-repuesto').value;
            if(!name) return; repuestosActuales.push({ nombre: name, cantidad: parseInt(cant) }); 
            renderRep(); document.getElementById('buscador-repuesto').value = ''; 
        }

        function renderRep() { 
            document.getElementById('lista-repuestos-seleccionados').innerHTML = repuestosActuales.map((r, i) => `<li class="flex justify-between bg-white p-2 border rounded-xl text-xs shadow-sm font-medium"><span>${r.nombre} <b>x${r.cantidad}</b></span><button onclick="repuestosActuales.splice(${i},1);renderRep()" class="text-red-400 px-2"><i class="fa-solid fa-trash"></i></button></li>`).join(''); 
        }

        // Conexión con Google Sheets
        async function cargarPendientes() {
            showScreen('presupuesto-list-screen'); document.getElementById('lista-pendientes').innerHTML = ''; document.getElementById('loading-pendientes').classList.remove('hidden');
            try {
                const res = await fetch(WEB_APP_URL); const data = await res.json(); document.getElementById('loading-pendientes').classList.add('hidden');
                data.forEach(p => {
                    const div = document.createElement('div'); div.className = "bg-white p-5 rounded-2xl shadow-sm border-l-8 border-azul cursor-pointer";
                    div.onclick = () => { otActiva = p; document.getElementById('ot-numero').innerText = p.ot; document.getElementById('det-cliente').innerText = p.nombre; document.getElementById('det-equipo').innerText = p.marca + " " + p.modelo; document.getElementById('det-falla').innerText = p.falla; repuestosActuales = []; renderRep(); showScreen('presupuesto-detail-screen'); };
                    div.innerHTML = `<span class="text-[10px] font-bold text-azul uppercase">OT-${p.ot}</span><h3 class="font-bold">${p.nombre}</h3><p class="text-xs text-gray-400">${p.marca} ${p.modelo}</p>`;
                    document.getElementById('lista-pendientes').appendChild(div);
                });
            } catch (e) { alert("Error de conexión"); }
        }

        async function enviarPresupuesto() {
            const diag = document.getElementById('diagnostico').value; const val = document.getElementById('valor-neto').value;
            if(!diag || !val) return alert("⚠️ Completa diagnóstico y valor.");
            const btn = document.getElementById('btn-enviar-presupuesto'); btn.disabled = true; btn.innerHTML = 'PROCESANDO...';
            const payload = { action: "update_presupuesto", fila: otActiva.fila, diagnostico: diag, valor
