<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welding Manager Pro V18.2 - Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --azul: #0070f3; }
        .bg-azul { background-color: var(--azul); }
        .text-azul { color: var(--azul); }
        input:focus, textarea:focus, select:focus { outline: 2px solid var(--azul); border-color: transparent; }
        .loader { border-top-color: var(--azul); animation: spinner 0.6s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .autocomplete-dropdown { max-height: 200px; overflow-y: auto; z-index: 100; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .checkbox-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .card-pendientes:active { scale: 0.98; transition: 0.1s; }
    </style>
</head>
<body class="bg-gray-100 font-sans pb-10 text-gray-800">

    <div id="home-screen" class="p-6 max-w-md mx-auto h-screen flex flex-col justify-center relative">
        <span class="absolute top-4 left-4 text-[10px] font-black text-gray-400 uppercase tracking-widest">v18.2</span>
        <button onclick="showScreen('config-screen')" class="absolute top-6 right-6 text-gray-400 p-2 transition"><i class="fa-solid fa-gear text-3xl"></i></button>
        
        <div class="text-center mb-10 text-gray-900">
            <i class="fa-solid fa-bolt-lightning text-azul text-6xl mb-2"></i>
            <h1 class="text-3xl font-bold uppercase tracking-tighter">Welding Manager</h1>
            <p class="text-gray-500 text-sm italic text-center">Servicio Técnico Soluciones Integrales</p>
        </div>

        <div class="grid gap-4">
            <button onclick="showScreen('ingreso-screen')" class="bg-azul text-white p-6 rounded-2xl shadow-xl flex items-center justify-between active:scale-95 transition text-left">
                <div><span class="block text-xl font-bold">Ingreso de Equipo</span><span class="text-sm opacity-80">Nueva OT y Accesorios</span></div>
                <i class="fa-solid fa-plus-circle text-3xl text-white"></i>
            </button>
            <button onclick="cargarPendientes()" class="bg-white text-gray-700 p-6 rounded-2xl shadow flex items-center justify-between border-l-8 border-azul active:scale-95 transition text-left">
                <div><span class="block text-xl font-bold text-gray-900">Presupuesto</span><span class="text-sm opacity-50">Generar Cotización</span></div>
                <i class="fa-solid fa-file-invoice-dollar text-2xl text-azul"></i>
            </button>
            <button onclick="abrirInformes()" class="bg-white text-gray-700 p-6 rounded-2xl shadow flex items-center justify-between border-l-8 border-azul active:scale-95 transition text-left">
                <span class="text-xl font-bold text-gray-900">Informes</span><i class="fa-solid fa-chart-line text-2xl text-azul"></i>
            </button>
        </div>
    </div>

    <div id="informes-screen" class="hidden p-4 max-w-md mx-auto bg-white min-h-screen text-gray-900">
        <div class="flex items-center mb-6 sticky top-0 bg-white py-2 border-b z-50">
            <button onclick="showScreen('home-screen')" class="text-gray-600 mr-4 p-2"><i class="fa-solid fa-arrow-left text-2xl"></i></button>
            <h2 class="text-2xl font-bold">Panel de Gestión</h2>
        </div>
        
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100 shadow-sm">
                <span class="text-[10px] uppercase font-bold text-blue-400">Total OTs</span>
                <p id="stat-total" class="text-3xl font-black text-azul">0</p>
            </div>
            <div class="bg-orange-50 p-4 rounded-2xl border border-orange-100 shadow-sm">
                <span class="text-[10px] uppercase font-bold text-orange-400">En Taller</span>
                <p id="stat-taller" class="text-3xl font-black text-orange-600">0</p>
            </div>
        </div>

        <div class="bg-gray-50 p-5 rounded-2xl border mb-6 shadow-sm">
            <span class="text-[10px] uppercase font-bold text-gray-400">Presupuestado (Neto + IVA)</span>
            <p id="stat-dinero" class="text-2xl font-black text-green-600">$0</p>
        </div>

        <div class="space-y-4">
            <h3 class="font-bold text-sm uppercase text-gray-400 px-1">Marcas Frecuentes</h3>
            <div id="lista-marcas" class="space-y-2">
                </div>
        </div>
    </div>

    <div id="ingreso-screen" class="hidden p-4 max-w-md mx-auto bg-white min-h-screen">
        <div class="flex items-center mb-6 sticky top-0 bg-white py-2 border-b z-50">
            <button onclick="showScreen('home-screen')" class="text-gray-600 mr-4 p-2 text-gray-900"><i class="fa-solid fa-arrow-left text-2xl"></i></button>
            <h2 class="text-2xl font-bold text-gray-900">Registro de Ingreso</h2>
        </div>
        <form id="ingreso-form" class="space-y-6 pb-20 px-1">
            <div class="bg-blue-50 p-4 rounded-2xl space-y-3 border border-blue-100 shadow-sm relative text-gray-900">
                <input type="text" id="nombre" onkeyup="buscarCliente(this.value)" placeholder="Nombre Cliente / Empresa" class="w-full p-3 rounded-xl border text-gray-900" required autocomplete="off">
                <ul id="sugerencias-cliente" class="autocomplete-dropdown absolute w-full bg-white border hidden mt-1 left-0 text-gray-900"></ul>
                <input type="text" id="rut" placeholder="RUT" class="w-full p-3 rounded-xl border text-gray-900">
                <input type="tel" id="whatsapp" placeholder="WhatsApp / Celular" class="w-full p-3 rounded-xl border text-gray-900">
                <input type="text" id="direccion" placeholder="Dirección del Cliente" class="w-full p-3 rounded-xl border text-gray-900">
                <input type="email" id="correo" placeholder="Email del Cliente" class="w-full p-3 rounded-xl border shadow-sm text-gray-900">
            </div>
            
            <div class="bg-gray-50 p-4 rounded-2xl space-y-3 border border-gray-100 text-gray-900">
                <input type="text" id="marca" placeholder="Marca del Equipo" class="w-full p-3 rounded-xl border text-gray-900" required>
                <input type="text" id="modelo" placeholder="Modelo" class="w-full p-3 rounded-xl border text-gray-900">
                <input type="text" id="serie" placeholder="N° de Serie" class="w-full p-3 rounded-xl border text-gray-900">
                
                <div class="p-2 border-t mt-2">
                    <p class="text-[10px] font-bold text-gray-500 uppercase mb-3 tracking-widest text-gray-900">Accesorios Recibidos:</p>
                    <div class="checkbox-grid text-xs font-semibold text-gray-700">
                        <label class="flex items-center gap-2"><input type="checkbox" class="acc" value="Pistola"> Pistola (MIG)</label>
                        <label class="flex items-center gap-2"><input type="checkbox" class="acc" value="Carrete de alambre"> Carrete Alambre</label>
                        <label class="flex items-center gap-2"><input type="checkbox" class="acc" value="Regulador"> Regulador</label>
                        <label class="flex items-center gap-2"><input type="checkbox" class="acc" value="Porta Electrodo"> Porta Electrodo</label>
                        <label class="flex items-center gap-2"><input type="checkbox" class="acc" value="Grampa Tierra"> Grampa Tierra</label>
                        <label class="flex items-center gap-2"><input type="checkbox" class="acc" value="Cable Alimentación"> Cable Aliment.</label>
                        <label class="flex items-center gap-2"><input type="checkbox" class="acc" value="Enchufe"> Enchufe</label>
                    </div>
                    <input type="text" id="otros-acc" placeholder="Otros accesorios..." class="w-full mt-3 p-2 border-b bg-transparent text-sm text-gray-900">
                </div>
            </div>

            <div class="relative">
                <label class="font-bold text-gray-400 uppercase text-[10px] px-1">Falla Reportada</label>
                <textarea id="falla" placeholder="Dicta o escribe la falla..." class="w-full p-4 rounded-2xl border h-32 bg-gray-50 mt-1 shadow-inner text-gray-900"></textarea>
                <button type="button" onclick="iniciarDictado('falla')" class="absolute right-3 bottom-3 bg-azul text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center active:scale-90 transition"><i class="fa-solid fa-microphone text-xl"></i></button>
            </div>
            <button type="submit" id="btn-submit" class="w-full bg-azul text-white py-5 rounded-2xl font-bold text-xl shadow-lg active:scale-95 transition uppercase tracking-widest text-center">Registrar Ingreso</button>
        </form>
    </div>

    <div id="presupuesto-list-screen" class="hidden p-4 max-w-md mx-auto bg-gray-50 min-h-screen text-gray-900">
        <div class="flex items-center mb-6 sticky top-0 bg-gray-50 py-2 border-b z-50 text-gray-900">
            <button onclick="showScreen('home-screen')" class="text-gray-600 mr-4 p-2 text-gray-900"><i class="fa-solid fa-arrow-left text-2xl"></i></button>
            <h2 class="text-2xl font-bold text-gray-900">Equipos en Taller</h2>
        </div>
        <div id="loading-pendientes" class="flex flex-col items-center justify-center py-20 hidden text-gray-900">
            <div class="loader rounded-full border-4 h-12 w-12 mb-4 border-t-azul"></div>
            <p>Sincronizando...</p>
        </div>
        <div id="lista-pendientes" class="space-y-4 pb-10"></div>
    </div>

    <div id="presupuesto-detail-screen" class="hidden p-4 max-w-md mx-auto bg-white min-h-screen pb-20 shadow-2xl text-gray-900">
        <div class="flex items-center mb-6 sticky top-0 bg-white py-2 border-b z-50">
            <button onclick="showScreen('presupuesto-list-screen')" class="text-gray-600 mr-4 p-2 transition active:scale-90 text-gray-900"><i class="fa-solid fa-arrow-left text-2xl"></i></button>
            <h2 class="text-2xl font-bold text-gray-900">OT: <span id="ot-numero" class="text-azul font-black"></span></h2>
        </div>
        
        <div class="space-y-5 px-1 text-gray-900">
            <div class="bg-gray-100 p-4 rounded-2xl border-l-8 border-azul text-sm shadow-sm text-gray-900">
                <p id="det-cliente" class="text-lg font-bold text-gray-900"></p>
                <p id="det-equipo" class="text-gray-600 font-semibold"></p>
                <p id="det-falla" class="mt-2 text-red-700 italic border-t border-gray-200 pt-2"></p>
            </div>
            
            <div class="relative">
                <div class="flex justify-between items-center mb-1 text-gray-900">
                    <label class="font-bold text-azul uppercase text-[10px] tracking-widest flex items-center gap-1"><i class="fa-solid fa-stethoscope"></i> Diagnóstico Técnico</label>
                    <button onclick="document.getElementById('foto-input').click()" class="text-azul p-1"><i class="fa-solid fa-camera text-xl"></i></button>
                    <input type="file" id="foto-input" accept="image/*" capture="environment" class="hidden" onchange="previewImagen(this)">
                </div>
                <textarea id="diagnostico" placeholder="Describe los hallazgos técnicos..." class="w-full p-4 rounded-2xl border h-32 bg-gray-50 shadow-inner text-gray-900"></textarea>
                <button type="button" onclick="iniciarDictado('diagnostico')" class="absolute right-3 bottom-3 bg-azul text-white w-10 h-10 rounded-full shadow-lg flex items-center justify-center active:scale-90 transition"><i class="fa-solid fa-microphone text-lg text-white"></i></button>
                <div id="preview-container" class="flex gap-2 mt-2 overflow-x-auto text-gray-900"></div>
            </div>

            <div class="bg-gray-50 p-4 rounded-3xl border border-gray-200 shadow-sm text-gray-900">
                <label class="font-bold text-azul uppercase text-[10px] tracking-widest text-gray-900">Repuestos / Servicios</label>
                <div class="flex gap-2 mt-1 relative">
                    <input type="text" id="buscador-repuesto" onkeyup="buscarRepuesto(this.value)" placeholder="Buscar repuesto..." class="flex-1 p-3 rounded-xl border text-sm text-gray-900" autocomplete="off">
                    <ul id="sugerencias-repuestos" class="autocomplete-dropdown absolute w-full bg-white border hidden z-50 shadow-xl mt-12 text-gray-900"></ul>
                    <input type="number" id="cantidad-repuesto" value="1" min="1" class="w-16 p-3 rounded-xl border text-center font-bold text-gray-900">
                    <button onclick="agregarRepuestoLista()" class="bg-azul text-white px-4 rounded-xl shadow-md active:scale-90 transition"><i class="fa-solid fa-plus text-white"></i></button>
                </div>
                <ul id="lista-repuestos-seleccionados" class="space-y-2 mt-3 text-gray-900"></ul>
            </div>

            <div class="grid grid-cols-2 gap-3 text-gray-900">
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase px-1">Plazo de Entrega</label>
                    <select id="plazo" class="w-full p-4 rounded-xl border bg-gray-50 font-bold text-sm shadow-sm text-gray-700">
                        <option value="3 días hábiles">3 días</option>
                        <option value="5 días hábiles">5 días</option>
                        <option value="8 días hábiles">8 días</option>
                        <option value="15 días hábiles">15 días</option>
                        <option value="45 días hábiles">45 días</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase px-1 text-gray-900">Valor Neto</label>
                    <input type="number" id="valor-neto" placeholder="Neto CLP" class="w-full p-4 rounded-xl border bg-gray-50 text-xl font-black shadow-sm text-gray-900">
                </div>
            </div>
            
            <button id="btn-enviar-presupuesto" onclick="enviarPresupuesto()" class="w-full bg-green-600 text-white py-5 rounded-2xl font-bold text-xl shadow-xl active:scale-95 transition uppercase tracking-widest text-center">Generar Cotización</button>
        </div>
    </div>

    <div id="config-screen" class="hidden p-4 max-w-md mx-auto bg-white min-h-screen text-gray-900">
        <div class="flex items-center mb-6 sticky top-0 bg-white py-2 border-b z-50">
            <button onclick="showScreen('home-screen')" class="text-gray-600 mr-4 p-2 transition active:scale-90 text-gray-900"><i class="fa-solid fa-arrow-left text-2xl"></i></button>
            <h2 class="text-2xl font-bold text-gray-900">Configuración</h2>
        </div>
        <div class="space-y-8 pb-10">
            <div class="bg-orange-50 p-4 rounded-2xl border border-orange-200">
                <label class="font-bold text-orange-700 uppercase text-xs">Llave IA (Groq gsk_...)</label>
                <div class="flex gap-2 mt-2">
                    <input type="password" id="ia-key-input" placeholder="Pega tu llave aquí..." class="flex-1 p-3 rounded-xl border bg-white">
                    <button onclick="guardarIAKey()" class="bg-orange-600 text-white px-4 rounded-xl shadow-md"><i class="fa-solid fa-save"></i></button>
                </div>
            </div>
            <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200 shadow-inner text-gray-900">
                <label class="font-bold text-azul uppercase text-xs">Repuestos Maestros</label>
                <textarea id="import-repuestos" class="w-full p-3 rounded-xl border h-32 text-sm mt-2 text-gray-900" placeholder="Uno por línea..."></textarea>
                <button onclick="importarRepuestosMasivo()" class="w-full bg-azul text-white py-3 rounded-xl font-bold mt-2 shadow-md active:scale-95">Actualizar Base</button>
            </div>
            <div class="bg-blue-50 p-4 rounded-2xl border border-blue-200 shadow-inner text-gray-900">
                <label class="font-bold text-blue-700 uppercase text-xs">Cargar Clientes Habituales</label>
                <textarea id="import-clientes" class="w-full p-3 rounded-xl border h-32 text-sm mt-2 text-gray-900" placeholder="Nombre, RUT, Dirección, Celular, Correo..."></textarea>
                <button onclick="importarClientesMasivo()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mt-2 shadow-md active:scale-95 text-white">Actualizar Clientes</button>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz2t1slR2Ymxqnw_hre-y7bDQgZFtLsYYqj7du-9U0bBpDjMSl0g4hHCyILTwSFkBc1/exec";
        let clientesDB = [];
        let clientesLocales = JSON.parse(localStorage.getItem('wm_clientes_locales')) || [];
        let repuestosDB = JSON.parse(localStorage.getItem('wm_repuestos')) || [];
        let otActiva = null; let repuestosActuales = []; let fotosCapturadas = [];

        window.onload = () => {
            const iaK = localStorage.getItem('wm_ia_key');
            if(iaK) document.getElementById('ia-key-input').value = iaK;
            sincronizarBaseAlInicio();
        };

        async function sincronizarBaseAlInicio() {
            try { const res = await fetch(WEB_APP_URL); clientesDB = await res.json(); } catch(e) { console.log("Modo offline"); }
        }

        function showScreen(id) { document.querySelectorAll('div[id$="-screen"]').forEach(s => s.style.display = 'none'); document.getElementById(id).style.display = (id === 'home-screen') ? 'flex' : 'block'; window.scrollTo(0,0); }
        function iniciarDictado(id) { const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)(); rec.lang = 'es-ES'; rec.start(); rec.onresult = (e) => { document.getElementById(id).value = e.results[0][0].transcript; }; }
        function guardarIAKey() { localStorage.setItem('wm_ia_key', document.getElementById('ia-key-input').value.trim()); alert("✅ Llave IA Guardada."); }

        function buscarCliente(t) {
            const ul = document.getElementById('sugerencias-cliente'); ul.innerHTML = '';
            if(t.length < 2) { ul.classList.add('hidden'); return; }
            const baseCombinada = [...clientesDB, ...clientesLocales];
            const fil = baseCombinada.filter(c => c.nombre.toLowerCase().includes(t.toLowerCase()));
            if(fil.length === 0) { ul.classList.add('hidden'); return; }
            ul.classList.remove('hidden');
            fil.forEach(c => {
                const li = document.createElement('li'); li.className = "p-4 border-b hover:bg-blue-50 cursor-pointer font-semibold text-sm text-gray-900"; li.innerText = c.nombre;
                li.onclick = () => { document.getElementById('nombre').value = c.nombre; document.getElementById('rut').value = c.rut || ''; document.getElementById('direccion').value = c.direccion || ''; document.getElementById('whatsapp').value = c.whatsapp || ''; document.getElementById('correo').value = c.correo || ''; ul.classList.add('hidden'); };
                ul.appendChild(li);
            });
        }

        function buscarRepuesto(t) {
            const ul = document.getElementById('sugerencias-repuestos'); ul.innerHTML = '';
            if(t.length < 2) { ul.classList.add('hidden'); return; }
            const fil = repuestosDB.filter(r => r.toLowerCase().includes(t.toLowerCase()));
            if(fil.length === 0) { ul.classList.add('hidden'); return; }
            ul.classList.remove('hidden');
            fil.forEach(r => {
                const li = document.createElement('li'); li.className = "p-3 border-b hover:bg-gray-100 cursor-pointer text-xs font-medium text-gray-900"; li.innerText = r;
                li.onclick = () => { document.getElementById('buscador-repuesto').value = r; ul.classList.add('hidden'); };
                ul.appendChild(li);
            });
        }

        function importarRepuestosMasivo() { const t = document.getElementById('import-repuestos').value; if(!t.trim()) return; const l = t.split('\n').map(x => x.trim()).filter(x => x !== ""); repuestosDB = [...new Set([...repuestosDB, ...l])]; localStorage.setItem('wm_repuestos', JSON.stringify(repuestosDB)); alert("✅ Repuestos cargados."); }
        function importarClientesMasivo() { const t = document.getElementById('import-clientes').value; if(!t.trim()) return; const l = t.split('\n').map(x => { const parts = x.split(',').map(p => p.trim()); return { nombre: parts[0], rut: parts[1] || '', direccion: parts[2] || '', whatsapp: parts[3] || '', correo: parts[4] || '' }; }).filter(x => x.nombre); clientesLocales = l; localStorage.setItem('wm_clientes_locales', JSON.stringify(clientesLocales)); alert("✅ Base de clientes actualizada."); }

        function previewImagen(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { fotosCapturadas.push(e.target.result); const img = document.createElement('img'); img.src = e.target.result; img.className = "h-20 w-20 object-cover rounded-lg border-2 border-azul"; document.getElementById('preview-container').appendChild(img); }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function agregarRepuestoLista() { const name = document.getElementById('buscador-repuesto').value; const cant = document.getElementById('cantidad-repuesto').value; if(!name) return; repuestosActuales.push({ nombre: name, cantidad: parseInt(cant) }); renderRep(); document.getElementById('buscador-repuesto').value = ''; }
        function renderRep() { document.getElementById('lista-repuestos-seleccionados').innerHTML = repuestosActuales.map((r, i) => `<li class="flex justify-between bg-white p-2 border rounded-xl text-xs shadow-sm font-medium text-gray-900 text-gray-900"><span>${r.nombre} <b>x${r.cantidad}</b></span><button onclick="repuestosActuales.splice(${i},1);renderRep()" class="text-red-400 px-2"><i class="fa-solid fa-trash text-red-500"></i></button></li>`).join(''); }

        // --- LÓGICA INFORMES V18.2 ---
        async function abrirInformes() {
            showScreen('informes-screen');
            const res = await fetch(WEB_APP_URL);
            const data = await res.json();
            
            document.getElementById('stat-total').innerText = data.length;
            const taller = data.filter(x => !x.diagnostico).length;
            document.getElementById('stat-taller').innerText = taller;
            
            let totalPlata = 0;
            const marcas = {};
            data.forEach(x => {
                if(x.valor) totalPlata += parseInt(x.valor);
                if(x.marca) {
                    const m = x.marca.toUpperCase();
                    marcas[m] = (marcas[m] || 0) + 1;
                }
            });
            
            const totalConIva = Math.round(totalPlata * 1.19);
            document.getElementById('stat-dinero').innerText = `$${new Intl.NumberFormat("es-CL").format(totalConIva)} CLP (IVA inc.)`;
            
            const sortedMarcas = Object.entries(marcas).sort((a,b) => b[1] - a[1]).slice(0, 5);
            document.getElementById('lista-marcas').innerHTML = sortedMarcas.map(m => `
                <div class="flex justify-between bg-gray-50 p-3 rounded-xl border border-gray-100 text-sm">
                    <span class="font-bold text-gray-700">${m[0]}</span>
                    <span class="bg-azul text-white px-2 py-1 rounded-lg text-[10px]">${m[1]} Equipos</span>
                </div>
            `).join('');
        }

        async function cargarPendientes() {
            showScreen('presupuesto-list-screen'); document.getElementById('lista-pendientes').innerHTML = ''; document.getElementById('loading-pendientes').classList.remove('hidden');

        async function enviarPresupuesto() {
            const diag = document.getElementById('diagnostico').value; const val = document.getElementById('valor-neto').value;
            if(!diag || !val) return alert("⚠️ Completa diagnóstico y valor.");
            const btn = document.getElementById('btn-enviar-presupuesto'); btn.disabled = true; btn.innerHTML = 'GENERANDO...';
            const payload = { action: "update_presupuesto", fila: otActiva.fila, diagnostico: diag, valor: val };
            try { await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }); generarPDFGlobal('COT', otActiva, { diagnostico: diag, repuestos: repuestosActuales, plazo: document.getElementById('plazo').value, valorNeto: val }); alert("✅ Cotización generada."); location.reload(); } catch (e) { alert("Error."); btn.disabled = false; }
        }

        document.getElementById('ingreso-form').addEventListener('submit', async (e) => {
            e.preventDefault(); const btn = document.getElementById('btn-submit'); btn.disabled = true; btn.innerHTML = 'REGISTRANDO...';
            const accs = Array.from(document.querySelectorAll('.acc:checked')).map(el => el.value).join(', ');
            const otros = document.getElementById('otros-acc').value;
            const totalAcc = accs + (otros ? (accs ? ', ' : '') + otros : '');
            const d = { nombre: document.getElementById('nombre').value, rut: document.getElementById('rut').value, whatsapp: document.getElementById('whatsapp').value, direccion: document.getElementById('direccion').value, correo: document.getElementById('correo').value, marca: document.getElementById('marca').value, modelo: document.getElementById('modelo').value, serie: document.getElementById('serie').value, falla: document.getElementById('falla').value, accesorios: totalAcc };
            try { 
                const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(d) });
                const result = await res.json();
                generarPDFGlobal('OT', { ...d, ot: result.ot }, {});
                alert("✅ OT #" + result.ot + " Registrada con éxito."); 
                location.reload(); 
            } catch (e) { alert("Error de conexión."); btn.disabled = false; btn.innerHTML = 'REGISTRAR INGRESO'; }
        });
    </script>
